# ─── MCP servers ───────────────────────────────────────────────────────────

[[mcp]]
name = "rea"
command = "npx"
args = ["-y", "rea-agents@6.9.0", "mcp"]
group = "core"
agents = ["claude", "codex"]
why = "Not in opencode: DeepSeek rejects one of rea's tool schemas (a regex pattern), which fails every request."

[[mcp]]
name = "context7"
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.7.1"]
group = "core"
why = "Current library docs on demand, so the model stops guessing at APIs from training data."

