# Spellfile: everything Spellbook installs that lives outside this repo.
#
# Groups: "core" installs by default. Others are opt-in:
#   ./install.sh --with routing,personal
#
# Kinds:
#   [[tool]]   CLI on PATH. `check` is the command to look for; `install` runs when it is missing.
#   [[skill]]  Agent Skills from a GitHub repo, installed with `npx skills` into every selected agent.
#   [[mcp]]    MCP server registered with Claude Code, Codex, and opencode (`agents` narrows it).
#   [[plugin]] Agent-specific plugin. Use it only when a skill or MCP server can't do the job.
#
# `replaces` lists the old ai-dotfiles skills this entry retires (see docs/SKILLS.md).

# ─── tools ──────────────────────────────────────────────────────────────────

[[tool]]
name = "slopbliterator"
group = "core"
check = "slop-lint"
install = "pipx install git+https://github.com/MichelKazi/slopbliterator.git"
why = "STE linter for outward prose. The slop gate hook calls it."

[[tool]]
name = "opencode"
group = "core"
check = "opencode"
install = "npm install -g opencode-ai@1.19.5"

[[tool]]
name = "d2"
group = "core"
check = "d2"
install = "brew install d2"
why = "Renderer for the architecture-diagram skill."

# ─── skills: writing ───────────────────────────────────────────────────────

[[skill]]
source = "MichelKazi/slopbliterator"
skills = ["slopbliterator"]
group = "core"
replaces = ["no-ai-slop"]
why = "Measured STE linter plus a diff-aware substance check, instead of a banned-word list."

# ─── skills: engineering process ───────────────────────────────────────────

[[skill]]
source = "obra/superpowers"
skills = [
  "brainstorming",
  "writing-plans",
  "executing-plans",
  "test-driven-development",
  "systematic-debugging",
  "verification-before-completion",
  "requesting-code-review",
  "receiving-code-review",
  "dispatching-parallel-agents",
  "subagent-driven-development",
  "using-git-worktrees",
  "finishing-a-development-branch",
  "using-superpowers",
]
group = "core"
replaces = ["root-cause-tracing", "code-self-check", "code-review-session", "deep-review", "create-pr"]
why = "Most-used process skill set. Debugging, TDD, verification, and review discipline in one maintained package."

[[skill]]
source = "anthropics/skills"
skills = ["skill-creator", "frontend-design", "webapp-testing", "mcp-builder"]
group = "core"
replaces = ["mobile-app-design"]
why = "Anthropic's maintained skills. frontend-design is what the design skill routes web UI work to."

[[skill]]
source = "vercel-labs/skills"
skills = ["find-skills"]
group = "core"
replaces = ["find-skills"]
why = "Same skill, from the source, so it stays current."

